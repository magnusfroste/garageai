# Traefik for the GarageAI gateway: the one reverse proxy and the one set of Let's Encrypt
# certificates on the VPS. LiteLLM (api.garageai.eu, llm.garageai.eu) and the Operations Center
# publish themselves with Docker labels on the shared network "garageai_proxy", which this stack
# creates. Cut-over from the NetBird installer's Traefik: README.md next to this file.
#
#   docker compose up -d        (in /opt/garageai/traefik)

name: garageai-traefik

services:
  traefik:
    image: traefik:v3.7.16
    container_name: garageai-traefik
    restart: unless-stopped
    networks: [proxy]
    command:
      - "--log.level=INFO"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=garageai_proxy"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.allowACMEByPass=true"
      # Streaming completions can run for minutes: no server-side read/write/idle timeouts.
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.writeTimeout=0"
      - "--entrypoints.websecure.transport.respondingTimeouts.idleTimeout=0"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.email=admin@garageai.eu"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
      - "--serverstransport.forwardingtimeouts.responseheadertimeout=0s"
      - "--serverstransport.forwardingtimeouts.idleconntimeout=0s"
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    logging:
      driver: json-file
      options: {max-size: "500m", max-file: "2"}

networks:
  proxy:
    name: garageai_proxy
    driver: bridge

volumes:
  letsencrypt:
    name: garageai_traefik_letsencrypt
