# LiteLLM configuration for the GarageAI gateway.
#
# There is no model_list here on purpose: garage models are added and removed at
# runtime by infra/gateway/register-node.sh (STORE_MODEL_IN_DB=True).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Spend logs hold no prompts, but grow with every request (including rejected ones).
  maximum_spend_logs_retention_period: "30d"

litellm_settings:
  # garageai_callbacks.py: fixes tool schemas so the pre-call context check can count Claude Code prompts.
  callbacks: garageai_callbacks.proxy_handler_instance
  drop_params: true        # ignore OpenAI params a garage runtime doesn't support
  request_timeout: 600     # longest wait for a non-streamed reply (read timeout)

# Residential nodes drop out more often than datacenter ones: retry on another
# garage in the pool and take a failing garage out of rotation quickly.
router_settings:
  # Pool routing (several garages behind one public name): each request goes to one of the
  # garages that are up, in proportion to its `weight` (the portal sets it from the price:
  # cheaper garages get a larger share). Every garage that is up gets traffic, nothing is
  # measured that one slow request can skew, and the buyer's expected price is the weighted
  # mean of the garages' prices. The same model as OpenRouter's provider routing.
  # (latency-based-routing until 2026-10-12: it starved the slower garages.)
  routing_strategy: simple-shuffle
  # Count tokens before calling the garage and answer 400 context_length_exceeded when the
  # prompt does not fit the model's window (model_info.max_input_tokens). Without this the
  # garage rejects it after the stream has started, and coding agents (Codex, Claude Code)
  # see a broken stream instead of the error they know how to recover from (by compacting).
  enable_pre_call_checks: true
  # Streaming: give up when a garage sends nothing for 600 s. This includes the wait for
  # the first token: coding agents send prompts of 100k+ tokens, and prefilling those takes
  # minutes on home GPUs and on busy providers (120 s cut 3 % of agent requests; a fresh
  # 270k-token Hermes prompt on dgx-city needs ~285 s at 950 tok/s prefill, 2026-10-14).
  # A dead garage is taken out by the health check and the cooldown, not by this timeout.
  stream_timeout: 600
  # One retry: with a single garage per model a second retry only hits the same
  # dead garage again and keeps the buyer waiting.
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 60
  # Per kind of error (tested 2026-10-18 with a healthy and a failing deployment in one group):
  # - a provider that rejects our key (401/403), is gone (404) or times out is cooled down at the
  #   first failure, so the retry and the next buyers go to the other deployments at once;
  # - a 400 is the buyer's request (context too long, bad parameters), not a broken garage: it never
  #   cools a deployment down (before, two long Hermes prompts could take mimo out for a minute).
  retry_policy:
    DefaultRetries: 1
    AuthenticationErrorRetries: 1
    TimeoutErrorRetries: 1
    BadRequestErrorRetries: 0
    ContentPolicyViolationErrorRetries: 0
  allowed_fails_policy:
    AuthenticationErrorAllowedFails: 0
    NotFoundErrorAllowedFails: 0
    TimeoutErrorAllowedFails: 0
    BadRequestErrorAllowedFails: 1000000
    ContentPolicyViolationErrorAllowedFails: 1000000
