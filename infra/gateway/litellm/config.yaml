# LiteLLM configuration for the GarageAI gateway.
#
# There is no model_list here on purpose: garage models are added and removed at
# runtime by infra/gateway/register-node.sh (STORE_MODEL_IN_DB=True).

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Spend logs hold no prompts, but grow with every request (including rejected ones).
  maximum_spend_logs_retention_period: "30d"

litellm_settings:
  # garageai_callbacks.py: fixes tool schemas so the pre-call context check can count Claude Code prompts.
  callbacks: garageai_callbacks.proxy_handler_instance
  drop_params: true        # ignore OpenAI params a garage runtime doesn't support
  request_timeout: 600     # longest wait for a non-streamed reply (read timeout)

# Residential nodes drop out more often than datacenter ones: retry on another
# garage in the pool and take a failing garage out of rotation quickly.
router_settings:
  routing_strategy: latency-based-routing
  # Count tokens before calling the garage and answer 400 context_length_exceeded when the
  # prompt does not fit the model's window (model_info.max_input_tokens). Without this the
  # garage rejects it after the stream has started, and coding agents (Codex, Claude Code)
  # see a broken stream instead of the error they know how to recover from (by compacting).
  enable_pre_call_checks: true
  # Streaming: give up when a garage sends nothing for 300 s. This includes the wait for
  # the first token: coding agents send prompts of 100k+ tokens, and prefilling those takes
  # minutes on home GPUs and on busy providers (120 s cut 3 % of agent requests).
  stream_timeout: 300
  # One retry: with a single garage per model a second retry only hits the same
  # dead garage again and keeps the buyer waiting.
  num_retries: 1
  allowed_fails: 2
  cooldown_time: 60
