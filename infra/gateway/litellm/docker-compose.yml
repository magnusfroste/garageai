# LiteLLM gateway for GarageAI.
#
# Runs on the same VPS as the NetBird stack and is published through NetBird's
# built-in Traefik (entrypoint "websecure", cert resolver "letsencrypt"), so the
# VPS has a single reverse proxy and a single set of certificates.
#
# Start the NetBird stack first: this file joins its Docker network.
#   cp .env.example .env   # then fill in the values
#   docker compose up -d

name: garageai-litellm

services:
  litellm:
    image: ghcr.io/berriai/litellm:${LITELLM_VERSION:-v1.104.2}
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY in .env}
      # Lets register-node.sh add and remove garage models at runtime.
      STORE_MODEL_IN_DB: "True"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./garageai_callbacks.py:/app/garageai_callbacks.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal, netbird]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${NETBIRD_NETWORK:?set NETBIRD_NETWORK in .env}
      - traefik.http.services.litellm.loadbalancer.server.port=4000
      # Public: only the LLM API and liveness checks, rate limited per client IP.
      - traefik.http.routers.litellm.rule=Host(`${LITELLM_DOMAIN:?set LITELLM_DOMAIN in .env}`) && (Path(`/v1/chat/completions`) || Path(`/chat/completions`) || Path(`/v1/completions`) || Path(`/completions`) || Path(`/v1/embeddings`) || Path(`/embeddings`) || Path(`/v1/models`) || Path(`/models`) || Path(`/v1/messages`) || Path(`/v1/messages/count_tokens`) || Path(`/v1/responses`) || Path(`/health/liveliness`) || Path(`/health/readiness`))
      - traefik.http.routers.litellm.priority=300
      - traefik.http.routers.litellm.entrypoints=websecure
      - traefik.http.routers.litellm.tls=true
      - traefik.http.routers.litellm.tls.certresolver=letsencrypt
      - traefik.http.routers.litellm.service=litellm
      - traefik.http.routers.litellm.middlewares=litellm-ratelimit,litellm-strip
      - traefik.http.middlewares.litellm-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.litellm-ratelimit.ratelimit.burst=60
      # Buyers must not learn which garage or provider served them: LiteLLM adds headers with
      # the upstream api_base, deployment id and runtime model name. Keep only the call id
      # (support) and the total cost. Provider headers (llm_provider-*) are disabled in config.yaml.
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-model-api-base=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-model-id=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-model-name=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-model-group=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-version=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-key-spend=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-attempted-fallbacks=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-attempted-retries=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-callback-duration-ms=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-overhead-duration-ms=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-response-duration-ms=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-response-cost-input=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-response-cost-output=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-response-cost-reasoning=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-response-cost-tool-usage=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-response-cost-original=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-response-cost-discount-amount=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-response-cost-margin-amount=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.x-litellm-response-cost-margin-percent=
      # Upstream headers LiteLLM forwards as llm_provider-* (Traefik has no wildcard removal; this is the
      # set seen from Cloudflare, uvicorn/vLLM, Ollama and OpenAI-compatible servers).
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-alt-svc=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-cf-cache-status=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-cf-ray=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-cf-connecting-ip=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-cf-ipcountry=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-connection=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-content-encoding=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-content-type=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-content-length=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-transfer-encoding=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-date=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-nel=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-report-to=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-server=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-vary=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-via=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-request-id=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-powered-by=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-envoy-upstream-service-time=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-cache-control=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-strict-transport-security=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-set-cookie=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-access-control-allow-origin=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-access-control-allow-credentials=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-access-control-expose-headers=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-ratelimit-limit-requests=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-ratelimit-limit-tokens=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-ratelimit-remaining-requests=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-ratelimit-remaining-tokens=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-ratelimit-reset-requests=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-ratelimit-reset-tokens=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-openai-organization=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-openai-processing-ms=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-openai-version=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-litellm-response-cost=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-frame-options=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-x-content-type-options=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-cf-apo-via=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-age=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-etag=
      - traefik.http.middlewares.litellm-strip.headers.customresponseheaders.llm_provider-last-modified=
      # Admin API (model, key, user, spend routes): only with the master key, so buyer keys
      # cannot read /model/info (garage addresses) or trigger /health (real inference).
      - traefik.http.routers.litellm-admin.rule=Host(`${LITELLM_DOMAIN}`) && Header(`Authorization`, `Bearer ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in .env}`)
      - traefik.http.routers.litellm-admin.priority=200
      - traefik.http.routers.litellm-admin.entrypoints=websecure
      - traefik.http.routers.litellm-admin.tls=true
      - traefik.http.routers.litellm-admin.tls.certresolver=letsencrypt
      - traefik.http.routers.litellm-admin.service=litellm
      # Everything else (admin UI, /sso, /openapi.json, admin routes without the master key): 403.
      - traefik.http.routers.litellm-deny.rule=Host(`${LITELLM_DOMAIN}`)
      - traefik.http.routers.litellm-deny.priority=100
      - traefik.http.routers.litellm-deny.entrypoints=websecure
      - traefik.http.routers.litellm-deny.tls=true
      - traefik.http.routers.litellm-deny.tls.certresolver=letsencrypt
      - traefik.http.routers.litellm-deny.service=litellm
      - traefik.http.routers.litellm-deny.middlewares=litellm-deny
      - traefik.http.middlewares.litellm-deny.ipallowlist.sourcerange=127.0.0.1/32
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: litellm
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not on the netbird network and no published port: only LiteLLM reaches it.
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  internal: {}
  netbird:
    name: ${NETBIRD_NETWORK:?set NETBIRD_NETWORK in .env}
    external: true

volumes:
  pgdata:
