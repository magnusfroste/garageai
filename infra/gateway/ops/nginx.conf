# GarageAI Operations Center: static page and ops.json. Traefik in front does TLS and basic auth,
# and passes the signed-in user in X-Ops-User.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /whoami {
        default_type application/json;
        return 200 '{"user":"$http_x_ops_user"}';
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
