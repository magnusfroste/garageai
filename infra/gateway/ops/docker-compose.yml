# GarageAI Operations Center: a static page plus ops.json, written every minute by
# garageai-ops-collect on the host. Served by nginx behind NetBird's Traefik, with HTTPS
# and a sign-in with a 30-day session cookie (nginx auth_request against garageai-ops-api). Read-only, with one exception: the page can set and end its own silences, through
# a small API on the host (/api/, garageai-ops-api).
#
# .env (root, 0600): OPS_DOMAIN=ops.garageai.eu, OPS_CHAT_KEY (a LiteLLM key with a small budget, for the Chat page) and
# OPS_API_KEY (= /etc/garageai/ops-api.key, openssl rand -hex 32; nginx sends it to the ops API). The
# sign-in password is /etc/garageai/ops-password and the session key /etc/garageai/ops-session.key
# (openssl rand -hex 32), both root 0600, read by garageai-ops-api.
name: garageai-ops

services:
  ops:
    image: nginx:1.27-alpine
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp, /etc/nginx/conf.d]
    volumes:
      - /var/lib/garageai-ops/www:/usr/share/nginx/html:ro
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      OPS_CHAT_KEY: ${OPS_CHAT_KEY:?set OPS_CHAT_KEY in .env (a LiteLLM key for the Chat page)}
      OPS_API_KEY: ${OPS_API_KEY:?set OPS_API_KEY in .env (the key in /etc/garageai/ops-api.key, for /api/)}
      NGINX_ENVSUBST_FILTER: ^OPS_
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [netbird]
    extra_hosts: ["host.docker.internal:host-gateway"]   # the host's ops API, for /api/
    labels:
      - traefik.enable=true
      - traefik.docker.network=netbird_netbird
      - traefik.http.routers.ops-center.rule=Host(`${OPS_DOMAIN:?set OPS_DOMAIN in .env}`)
      - traefik.http.routers.ops-center.entrypoints=websecure
      - traefik.http.routers.ops-center.tls=true
      - traefik.http.routers.ops-center.tls.certresolver=letsencrypt
      - traefik.http.routers.ops-center.middlewares=ops-ratelimit,ops-headers
      - traefik.http.middlewares.ops-ratelimit.ratelimit.average=5
      - traefik.http.middlewares.ops-ratelimit.ratelimit.burst=20
      - traefik.http.middlewares.ops-headers.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.middlewares.ops-headers.headers.customresponseheaders.Cache-Control=no-store
      - traefik.http.middlewares.ops-headers.headers.framedeny=true
      - traefik.http.middlewares.ops-headers.headers.contenttypenosniff=true
      - traefik.http.services.ops.loadbalancer.server.port=80

networks:
  netbird:
    name: netbird_netbird
    external: true
