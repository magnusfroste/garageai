name: Bridge (Go)

on:
  pull_request:
    paths: ['cli/**', 'scripts/garageai-connect.sh', 'scripts/tests/**', '.github/workflows/cli.yml']
  push:
    branches: [main]
    paths: ['cli/**', 'scripts/garageai-connect.sh', 'scripts/tests/**', '.github/workflows/cli.yml']
    # A tag bridge-vX.Y.Z builds the binaries and publishes them as a release: publishing is
    # `git tag bridge-v0.2.0 && git push origin bridge-v0.2.0` and nothing else.
    tags: ['bridge-v*']

jobs:
  test:
    # Unit tests on the three operating systems operators use; on Linux and macOS also parity
    # with garageai-connect.sh --doctor --json against a fake runtime.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: doctor runs on this OS
        shell: bash
        run: |
          go build -o garageai .
          # A CI runner has no runtime and no NetBird, so doctor exits 1 (problems found): expected.
          ./garageai doctor --json > profile.json || true
          cat profile.json
          python3 -c "import json; p=json.load(open('profile.json')); assert p['schema']==1 and isinstance(p['problems'], list) and p['machine']['os'], p"
          ./garageai doctor || true
      - name: parity with garageai-connect.sh
        if: runner.os != 'Windows'
        shell: bash
        run: /bin/bash ../scripts/tests/parity-doctor.sh "$PWD/garageai"
      - name: Windows services round trip (schtasks, sc, icacls) with a built garageai.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          go build -o garageai.exe .
          $env:GARAGEAI_WINDOWS_SERVICE_TEST = "1"
          $env:GARAGEAI_TEST_BINARY = "$PWD\garageai.exe"
          go test ./internal/service -run WindowsServicesRoundTrip -v; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\garageai.exe doctor; if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }; exit 0  # 1 = findings (no runtime on the runner), fine
      - name: install.ps1 installs and leaves a working garageai on PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\dl" | Out-Null
          Copy-Item garageai.exe "$env:RUNNER_TEMP\dl\garageai-windows-amd64.exe"
          $h = (Get-FileHash "$env:RUNNER_TEMP\dl\garageai-windows-amd64.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  garageai-windows-amd64.exe" | Set-Content "$env:RUNNER_TEMP\dl\SHA256SUMS"
          Start-Process -NoNewWindow go -ArgumentList "run ./internal/testutil/fileserver $env:RUNNER_TEMP\dl 127.0.0.1:8765"
          Start-Sleep 3
          $env:GARAGEAI_BRIDGE_DOWNLOAD_BASE = "http://127.0.0.1:8765"
          $env:GARAGEAI_BRIDGE_VERSION = "bridge-vtest"  # no GitHub API lookup from the runner (rate limit)
          ./install.ps1
          $env:Path = "$env:Path;$env:LOCALAPPDATA\Programs\GarageAI"
          garageai version
      - name: install.sh ends in a working state (a new shell finds garageai)
        # As on an operator's Mac: /usr/local/bin is not writable without sudo, and the operator's
        # next command is `garageai doctor` in a shell with the default PATH. Found 2026-10-13 on
        # garage-m4: the script had fallen back to ~/.local/bin, which a Mac's PATH does not have.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dl" && cp garageai "$RUNNER_TEMP/dl/garageai-$(go env GOOS)-$(go env GOARCH)"
          (cd "$RUNNER_TEMP/dl" && shasum -a 256 garageai-* > SHA256SUMS)
          go run ./internal/testutil/fileserver "$RUNNER_TEMP/dl" 127.0.0.1:8765 &
          sleep 1
          sudo chown root /usr/local/bin && sudo chmod 755 /usr/local/bin && ! test -w /usr/local/bin
          mkdir -p ~/.local/bin && echo '#!/bin/sh' > ~/.local/bin/garageai && chmod +x ~/.local/bin/garageai   # an old copy, as on Macs updated before
          GARAGEAI_BRIDGE_DOWNLOAD_BASE=http://127.0.0.1:8765 sh install.sh < /dev/null
          env -i PATH=/usr/local/bin:/usr/bin:/bin garageai version
          ! test -e ~/.local/bin/garageai   # the old copy must be gone, or it shadows the new one

  tray:
    # The GarageAI icon on a real desktop (docs/bridge-menubar.md): built without cgo, started with
    # a live garage's status files, still running after 10 s, and a screenshot to look at.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: Status files of a live garage
        shell: python
        run: |
          import json, os, sys, datetime
          d = os.path.join(os.environ["ProgramData"], "GarageAI") if sys.platform == "win32" else "/tmp/garageai-etc"
          os.makedirs(d, exist_ok=True)
          now = datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          json.dump({"name": "garage-ci", "runtime": "ollama", "port": 11434, "transport": "tunnel"}, open(os.path.join(d, "bridge-public.json"), "w"))
          json.dump({"schema": 1, "updated_at": now, "version": "ci", "name": "garage-ci", "runtime": "ollama", "port": 11434,
                     "heartbeat": {"ok": True}, "models": ["qwen3:8b", "gemma4:12b"], "update": {"auto": True},
                     "portal": {"live": True, "requests_today": 142, "earned_today": 0.41, "currency": "EUR"}},
                    open(os.path.join(d, "status.json"), "w"))
          json.dump([{"at": now, "path": "chat", "status": 200, "ttfb_ms": 300, "total_ms": 2000, "streamed": True, "cold": False}],
                    open(os.path.join(d, "forward-stats.json"), "w"))
      - name: macOS menu bar
        if: runner.os == 'macOS'
        run: |
          sudo mkdir -p /etc/garageai && sudo cp /tmp/garageai-etc/*.json /etc/garageai/
          CGO_ENABLED=0 go build -o garageai .
          ./garageai tray --print
          ./garageai tray > tray.log 2>&1 & pid=$!
          sleep 10
          cat tray.log
          kill -0 $pid
          ./garageai tray | grep -q "already"  # a second one only says so
          screencapture -x -R 0,0,1600,40 menubar.png
          kill $pid
      - name: Windows notification area
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go build -o garageai.exe .
          .\garageai.exe tray --print
          $p = Start-Process -FilePath .\garageai.exe -ArgumentList tray -RedirectStandardOutput tray.log -RedirectStandardError tray.err -PassThru
          Start-Sleep 10
          Get-Content tray.log, tray.err
          if ($p.HasExited) { Write-Error "the icon exited: $($p.ExitCode)"; exit 1 }
          if (-not (Select-String -Path tray.log -Pattern "notification area" -Quiet)) { exit 1 }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD\menubar.png")
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tray-${{ runner.os }}
          path: cli/menubar.png

  build:
    # One codebase, six binaries. Uploaded as an artifact for trying; no release yet.
    runs-on: ubuntu-latest
    needs: [test, tray]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
      - name: cross-compile
        working-directory: cli
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}; arch=${target#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            v="${GITHUB_SHA::7}"; case "$GITHUB_REF" in refs/tags/bridge-v*) v="${GITHUB_REF#refs/tags/bridge-}" ;; esac
            GOOS=$os GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$v" -o "dist/garageai-$os-$arch$ext" .
          done
          (cd dist && sha256sum * > SHA256SUMS && ls -la)
      - uses: actions/upload-artifact@v4
        with:
          name: garageai-bridge-binaries
          path: cli/dist/

  release:
    # Experimental: published as a pre-release until Bridge replaces the connect script.
    if: startsWith(github.ref, 'refs/tags/bridge-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: garageai-bridge-binaries
          path: dist
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "GarageAI Bridge ${GITHUB_REF_NAME#bridge-}" \
            --notes "Experimental. Install: curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/cli/install.sh | sh -- then: garageai doctor"
