name: Scripts

on:
  pull_request:
    paths: ['scripts/**', 'infra/gateway/**', '.github/workflows/scripts.yml']
  push:
    branches: [main]
    paths: ['scripts/**', 'infra/gateway/**', '.github/workflows/scripts.yml']

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning scripts/garageai-connect.sh scripts/tests/test-connect.sh infra/gateway/register-node.sh infra/gateway/backup/garageai-backup
      - name: gateway health script compiles
        run: python3 -m py_compile infra/gateway/health/garageai-health.py

  connect-script:
    # macOS ships bash 3.2 and lsof; Linux has a newer bash and ss. Operators use both.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test garageai-connect.sh
        run: /bin/bash scripts/tests/test-connect.sh

  connect-script-windows:
    # No GPU or NetBird on the runner: this checks that the script parses and that -Doctor
    # works against a fake runtime, under Windows PowerShell 5.1 (what operators have) and 7.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test garageai-connect.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: .\scripts\tests\test-connect.ps1
      - name: Test garageai-connect.ps1 (PowerShell 7)
        shell: pwsh
        run: .\scripts\tests\test-connect.ps1
